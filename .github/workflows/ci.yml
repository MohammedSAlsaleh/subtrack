name: CI

on:
  push:
  pull_request:

jobs:
  validation:
    name: Tests and type checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @workspace/api-server test

      - name: Check TypeScript
        run: pnpm run typecheck

      - name: Run mobile regression scripts
        run: node --test artifacts/mobile/__tests__/*.test.js
